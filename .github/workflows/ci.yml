name: ci

on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: restaurant
          POSTGRES_PASSWORD: restaurant
          POSTGRES_DB: restaurant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U restaurant -d restaurant"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key
      JWT_SIGNING_KEY: ci-only-jwt-signing-key
      TRACKING_TOKEN_KEY: ci-only-tracking-token-key
      DATABASE_URL: postgres://restaurant:restaurant@localhost:5432/restaurant
      REDIS_URL: redis://localhost:6379/0
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/dev.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements/dev.txt
      - run: ruff check . --ignore RUF012,BLE001
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python -m pytest -q --maxfail=1
      - run: pip-audit -r requirements/base.txt
      - run: python manage.py spectacular --file schema.yml --validate --fail-on-warn
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
