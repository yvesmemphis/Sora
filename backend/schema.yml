openapi: 3.0.3
info:
  title: API Restaurant
  version: 1.0.0
paths:
  /api/v1/analytics/forecasts/:
    get:
      operationId: analytics_forecasts_list
      parameters:
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      tags:
      - analytics
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedForecastList'
          description: ''
  /api/v1/analytics/forecasts/{id}/{decision}/:
    post:
      operationId: analytics_forecasts_create
      parameters:
