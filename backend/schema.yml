          type: string
        required: true
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - analytics
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForecastReviewRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ForecastReviewRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ForecastReviewRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
