        generated_at:
          type: string
          format: date-time
          readOnly: true
        reviewed_by:
          type: integer
          readOnly: true
          nullable: true
        reviewed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        rejection_reason:
          type: string
          readOnly: true
      required:
      - confidence
      - explanation
      - generated_at
      - id
      - menu_item_id
      - menu_item_name
      - period_end
      - period_start
      - predicted_quantity
      - rejection_reason
      - reviewed_at
      - reviewed_by
      - status
      - version
