components:
  schemas:
    AlertTypeEnum:
      enum:
      - LOW_STOCK
      - OVERSTOCK
      - EXPIRING
      type: string
      description: |-
        * `LOW_STOCK` - Stock bas
        * `OVERSTOCK` - Surstock
        * `EXPIRING` - Péremption proche
    AuditEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        actor_email:
          type: string
          format: email
          readOnly: true
        action:
          type: string
          maxLength: 100
        resource_type:
          type: string
          maxLength: 100
        resource_id:
          type: string
          maxLength: 100
        result:
          type: string
          maxLength: 10
        metadata: {}
      required:
      - action
      - actor_email
      - created_at
      - id
    AvailabilityStatusEnum:
      enum:
      - AVAILABLE
      - SOLD_OUT
      - TEMPORARILY_UNAVAILABLE
      type: string
      description: |-
        * `AVAILABLE` - Disponible
        * `SOLD_OUT` - Épuisé
        * `TEMPORARILY_UNAVAILABLE` - Temporairement indisponible
    BlankEnum:
      enum:
      - ''
    CashRegisterClosure:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        closed_for:
          type: string
          format: date
          readOnly: true
        closed_by_email:
          type: string
          format: email
          readOnly: true
        expected_totals:
          readOnly: true
        expected_cash:
          readOnly: true
        counted_cash:
          readOnly: true
        closed_at:
          type: string
          format: date-time
          readOnly: true
        notes:
          type: string
          readOnly: true
      required:
      - closed_at
      - closed_by_email
      - closed_for
      - counted_cash
      - expected_cash
      - expected_totals
      - id
      - notes
    CashRegisterClosureCreateRequest:
      type: object
      properties:
        closed_for:
          type: string
          format: date
        counted_cash:
          type: object
          additionalProperties:
            type: string
            format: decimal
            pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        notes:
          type: string
          maxLength: 500
    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 120
        position:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        is_active:
          type: boolean
      required:
      - id
      - name
    CategoryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        position:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        is_active:
          type: boolean
      required:
      - name
    Dish:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        category:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 160
        description:
          type: string
          maxLength: 1000
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        preparation_time:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        allergens: {}
        is_available:
          type: boolean
        availability_status:
          $ref: '#/components/schemas/AvailabilityStatusEnum'
        is_published:
          type: boolean
        image:
          type: string
          format: uri
          nullable: true
      required:
      - category
      - id
      - name
      - price
    DishRequest:
      type: object
      properties:
        category:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: string
          maxLength: 1000
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        preparation_time:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        allergens: {}
        is_available:
          type: boolean
        availability_status:
          $ref: '#/components/schemas/AvailabilityStatusEnum'
        is_published:
          type: boolean
        image:
          type: string
          format: binary
          nullable: true
      required:
      - category
      - name
      - price
    Forecast:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        menu_item_id:
          type: string
          readOnly: true
        menu_item_name:
          type: string
          readOnly: true
        period_start:
          type: string
          format: date
          readOnly: true
        period_end:
          type: string
          format: date
          readOnly: true
        version:
          type: integer
          readOnly: true
        predicted_quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        confidence:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,4})?$
          readOnly: true
        explanation:
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ForecastStatusEnum'
